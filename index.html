<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238B5CF6'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3EPA%3C/text%3E%3C/svg%3E">
<title>Project Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
    --font-sans:'Inter', -apple-system, sans-serif;
    --radius-sm:6px; --radius:10px; --radius-lg:14px;
    --shadow-lg: 0 20px 60px -20px rgba(0,0,0,.5);
    --accent:#6f6bff;
    --accent-2:#22d3ee;
    --success:#22c55e;
    --warning:#f5a623;
    --danger:#f5556c;
    --blue:#3b82f6;
    --transition: .18s cubic-bezier(.4,0,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#080a10;
    --bg-elevated:#0d1017;
    --surface:#10141c;
    --surface-2:#141a24;
    --surface-hover:#181f2b;
    --border:#1d2430;
    --border-soft:#161c26;
    --text-primary:#e7ecf3;
    --text-secondary:#8992a6;
    --text-tertiary:#4d5566;
    --scanline: rgba(111,107,255,.035);
  }
  html[data-theme="light"]{
    --bg:#f3f4f7;
    --bg-elevated:#ffffff;
    --surface:#ffffff;
    --surface-2:#f7f8fa;
    --surface-hover:#eef0f4;
    --border:#e2e5eb;
    --border-soft:#ececf1;
    --text-primary:#12141c;
    --text-secondary:#5b6172;
    --text-tertiary:#9aa0b0;
    --scanline: rgba(111,107,255,.02);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  ::selection{background:var(--accent); color:#fff;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 100% -10%, var(--scanline), transparent 60%),
      var(--bg);
    color:var(--text-primary);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button, input, textarea, select{font-family:inherit; color:inherit;}
  button{cursor:pointer;}
  a{color:inherit; text-decoration:none;}
  svg{display:block;}
  .icon{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

  .app{display:grid; grid-template-columns:236px 1fr; height:100vh;}

  .sidebar{
    background:var(--bg-elevated);
    border-right:1px solid var(--border-soft);
    display:flex; flex-direction:column;
    padding:20px 14px;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 22px 8px;}
  .brand__mark{
    width:32px; height:32px; border-radius:9px;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px -4px rgba(111,107,255,.55);
    flex-shrink:0;
    font-family:var(--font-mono); font-weight:800; font-size:12.5px; color:#fff; letter-spacing:-.5px;
  }
  .brand__mark svg{width:18px; height:18px; stroke:#fff;}
  .brand__text{display:flex; flex-direction:column; line-height:1.15;}
  .brand__text b{font-family:var(--font-mono); font-size:14.5px; font-weight:700; letter-spacing:.2px;}
  .brand__text span{font-size:10.5px; color:var(--text-tertiary); font-family:var(--font-mono); letter-spacing:.5px;}

  .nav-label{font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; color:var(--text-tertiary); text-transform:uppercase; padding:14px 10px 8px;}
  .nav{list-style:none; display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:9px 12px; border-radius:8px;
    color:var(--text-secondary); font-size:13.5px; font-weight:500;
    position:relative; transition:background var(--transition), color var(--transition);
    border:none; background:transparent; width:100%; text-align:left;
  }
  .nav-item .prompt{font-family:var(--font-mono); color:var(--text-tertiary); font-size:12px; width:11px; opacity:0; transition:opacity var(--transition), color var(--transition);}
  .nav-item:hover{background:var(--surface-hover); color:var(--text-primary);}
  .nav-item.active{background:var(--surface-2); color:var(--text-primary);}
  .nav-item.active .prompt{opacity:1; color:var(--accent-2);}
  .nav-item.active::before{
    content:''; position:absolute; left:-14px; top:50%; transform:translateY(-50%);
    width:3px; height:18px; border-radius:3px;
    background:linear-gradient(180deg, var(--accent), var(--accent-2));
    box-shadow:0 0 12px var(--accent);
  }
  .nav-item .icon{opacity:.85;}

  .sidebar-footer{margin-top:auto; display:flex; flex-direction:column; gap:8px;}
  .kbd-hint{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 11px; border:1px solid var(--border); border-radius:8px;
    color:var(--text-tertiary); font-size:11.5px; background:var(--surface);
  }
  .kbd-hint kbd{
    font-family:var(--font-mono); font-size:10.5px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:4px; padding:2px 6px; color:var(--text-secondary);
  }
  .theme-toggle{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:4px; position:relative;
  }
  .theme-toggle button{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:7px 0; border-radius:6px; font-size:11.5px; font-weight:600; background:transparent; border:none;
    color:var(--text-tertiary); transition:all var(--transition); font-family:var(--font-mono);
  }
  .theme-toggle button.active{background:var(--surface-2); color:var(--text-primary); box-shadow:inset 0 0 0 1px var(--border);}
  .theme-toggle .icon{width:14px; height:14px;}

  .main{display:flex; flex-direction:column; min-width:0; height:100vh;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; height:62px; border-bottom:1px solid var(--border-soft);
    background:var(--bg-elevated); flex-shrink:0;
  }
  .breadcrumb{display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12.5px; color:var(--text-tertiary);}
  .breadcrumb b{color:var(--text-primary); font-weight:600;}
  .breadcrumb .sep{color:var(--text-tertiary); opacity:.5;}
  .status-live{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-tertiary); font-family:var(--font-mono); margin-left:6px;}
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--success); box-shadow:0 0 8px var(--success); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

  .topbar-actions{display:flex; align-items:center; gap:10px;}
  .search-trigger{
    display:flex; align-items:center; gap:9px; padding:8px 12px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-tertiary);
    font-size:12.5px; width:230px; transition:border-color var(--transition);
  }
  .search-trigger:hover{border-color:var(--accent);}
  .search-trigger kbd{margin-left:auto; font-family:var(--font-mono); font-size:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:1px 5px;}
  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:8px;
    font-size:13px; font-weight:600; border:1px solid transparent; transition:all var(--transition);
    white-space:nowrap;
  }
  .btn-primary{background:linear-gradient(135deg, var(--accent), #857fff); color:#fff; box-shadow:0 8px 20px -8px rgba(111,107,255,.65);}
  .btn-primary:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .btn-ghost{background:var(--surface); border-color:var(--border); color:var(--text-secondary);}
  .btn-ghost:hover{color:var(--text-primary); border-color:var(--text-tertiary);}
  .btn-danger{background:rgba(245,85,108,.1); color:var(--danger); border-color:rgba(245,85,108,.3);}
  .btn-danger:hover{background:rgba(245,85,108,.18);}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* ---- Action icon buttons ---- */
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:7px; border:none;
    background:transparent; color:var(--text-tertiary);
    transition:background var(--transition), color var(--transition);
    cursor:pointer; flex-shrink:0;
  }
  .icon-btn:hover{background:var(--surface-hover); color:var(--text-primary);}
  /* Edit = green */
  .icon-btn.edit{color:#22c55e;}
  .icon-btn.edit:hover{background:rgba(34,197,94,.12); color:#22c55e;}
  /* Delete = red */
  .icon-btn.danger{color:var(--danger);}
  .icon-btn.danger:hover{background:rgba(245,85,108,.12); color:var(--danger);}

  .view{flex:1; overflow-y:auto; padding:28px 32px 60px;}
  .view::-webkit-scrollbar{width:10px;}
  .view::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
  .view::-webkit-scrollbar-track{background:transparent;}

  .view-header{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:14px;}
  .view-title{font-family:var(--font-mono); font-size:22px; font-weight:700; letter-spacing:-.3px;}
  .view-sub{color:var(--text-tertiary); font-size:13px; margin-top:5px;}

  .stat-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:26px;}
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; position:relative; overflow:hidden;
  }
  .stat-card::after{content:''; position:absolute; top:0; left:0; width:100%; height:2px; background:var(--bar-color, var(--accent));}
  .stat-card__top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .stat-card__icon{width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--bar-color, var(--accent));}
  .stat-card__icon .icon{width:16px; height:16px;}
  .stat-card__label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--text-tertiary);}
  .stat-card__value{font-size:30px; font-weight:800; font-family:var(--font-mono); letter-spacing:-.5px;}

  .badge{
    font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    padding:3px 8px; border-radius:20px; white-space:nowrap; flex-shrink:0;
    background:var(--status-bg); color:var(--status-color);
  }
  .type-pill{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:.5px; color:var(--accent-2); background:rgba(34,211,238,.12);
    border:1px solid rgba(34,211,238,.25); padding:3px 8px; border-radius:20px; width:fit-content;
  }

  .back-link{display:inline-flex; align-items:center; gap:7px; color:var(--text-tertiary); font-size:12.5px; font-family:var(--font-mono); margin-bottom:16px; background:transparent; border:none;}
  .back-link:hover{color:var(--text-primary);}
  .back-link .icon{width:14px; height:14px;}

  .tabs{display:flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:4px; width:fit-content; margin-bottom:20px; flex-wrap:wrap;}
  .tab{padding:7px 14px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--text-tertiary); background:transparent; border:none; font-family:var(--font-mono); transition:all var(--transition);}
  .tab.active{background:var(--surface-2); color:var(--text-primary); box-shadow:inset 0 0 0 1px var(--border);}
  .tab .count{opacity:.6; margin-left:4px;}

  .toolbar{display:flex; align-items:center; gap:12px; margin-bottom:6px; flex-wrap:wrap;}
  .field-search{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 12px; flex:1; min-width:200px; max-width:340px;}
  .field-search input{background:transparent; border:none; outline:none; font-size:13px; width:100%;}
  .field-search .icon{color:var(--text-tertiary);}

  .date-range-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .date-range-field{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 12px;}
  .date-range-field label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-tertiary); white-space:nowrap;}
  .date-picker-shell{position:relative; width:132px; min-height:22px; display:flex; align-items:center;}
  .date-picker-display{font-size:12.5px; color:var(--text-primary); font-family:var(--font-mono); white-space:nowrap; pointer-events:none;}
  .date-picker-display.is-empty{color:var(--text-tertiary);}
  .date-picker-icon{position:absolute; right:0; width:14px; height:14px; color:var(--accent); pointer-events:none;}
  .date-picker-shell input[type=date]{position:absolute; inset:0; width:100%; height:100%; opacity:0; border:none; outline:none; cursor:pointer;}
  .date-range-sep{color:var(--text-tertiary); font-family:var(--font-mono); font-size:12px;}
  .note-view-btn{display:inline-flex; align-items:center; gap:5px; color:var(--accent); background:transparent; border:1px solid transparent; border-radius:6px; padding:4px 7px; font-family:var(--font-mono); font-size:11px; cursor:pointer; transition:all var(--transition);}
  .note-view-btn:hover{color:var(--text-primary); background:rgba(111,107,255,.1); border-color:rgba(111,107,255,.3);}
  .note-view-btn .icon{width:13px; height:13px;}
  .note-content{color:var(--text-secondary); font-size:13.5px; line-height:1.7; white-space:normal; overflow-wrap:anywhere; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px; max-height:52vh; overflow-y:auto;}

  input[type=date]::-webkit-calendar-picker-indicator{
    filter: invert(48%) sepia(75%) saturate(3000%) hue-rotate(228deg) brightness(99%) contrast(101%);
    cursor:pointer;
    opacity:.9;
    transition:opacity var(--transition);
  }
  input[type=date]::-webkit-calendar-picker-indicator:hover{ opacity:1; }
  html[data-theme="light"] input[type=date]::-webkit-calendar-picker-indicator{
    filter: invert(35%) sepia(90%) saturate(1500%) hue-rotate(228deg) brightness(95%) contrast(105%);
  }
  .date-range-active{font-family:var(--font-mono); font-size:11px; color:var(--accent-2); background:rgba(34,211,238,.1); border:1px solid rgba(34,211,238,.25); padding:5px 10px; border-radius:20px; display:flex; align-items:center; gap:6px;}

  .empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; text-align:center; border:1px dashed var(--border); border-radius:var(--radius-lg); color:var(--text-tertiary);}
  .empty-state .icon{width:34px; height:34px; margin-bottom:14px; opacity:.5;}
  .empty-state h3{font-family:var(--font-mono); color:var(--text-secondary); font-size:15px; margin-bottom:6px;}
  .empty-state p{font-size:12.5px; max-width:320px; line-height:1.6;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(3,4,8,.6); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-lg);
    width:100%; max-width:480px; box-shadow:var(--shadow-lg); animation:modalIn .18s cubic-bezier(.2,.9,.3,1);
    max-height:88vh; display:flex; flex-direction:column;
  }
  @keyframes modalIn{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;}}
  .modal.confirm{max-width:400px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border-soft);}
  .modal-head h3{font-family:var(--font-mono); font-size:15px; font-weight:700; display:flex; align-items:center; gap:9px;}
  .modal-body{padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:16px;}
  .modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 20px; border-top:1px solid var(--border-soft);}
  .field{display:flex; flex-direction:column; gap:7px;}
  .field label{font-size:11.5px; font-weight:600; color:var(--text-secondary); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.4px;}
  .field .req{color:var(--danger);}
  .field input[type=text], .field input[type=date], .field input[type=url], .field textarea, .field select{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:13.5px; outline:none;
    transition:border-color var(--transition); width:100%;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:80px; line-height:1.5; font-family:var(--font-sans);}
  .field-hint{font-size:11px; color:var(--text-tertiary); line-height:1.5;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .agent-picker{position:relative; width:100%;}
  .agent-picker-trigger{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; min-height:42px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 10px; color:var(--text-primary); text-align:left; transition:border-color var(--transition), box-shadow var(--transition);}
  .agent-picker-trigger:hover,.agent-picker.open .agent-picker-trigger{border-color:var(--accent); box-shadow:0 0 0 2px rgba(111,107,255,.12);}
  .agent-picker-trigger .icon{width:15px; height:15px; color:var(--text-tertiary); flex-shrink:0;}
  .agent-picker-value,.agent-picker-option{display:flex; align-items:center; gap:9px; min-width:0;}
  .agent-picker-value__text,.agent-picker-option__text{display:flex; flex-direction:column; min-width:0; line-height:1.2;}
  .agent-picker-value__name,.agent-picker-option__name{font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .agent-picker-value__role,.agent-picker-option__role{font-size:10.5px; color:var(--text-tertiary); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .agent-picker-value.empty{color:var(--text-tertiary); font-style:italic;}
  .agent-picker-menu{position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20; display:none; background:var(--bg-elevated); border:1px solid var(--border); border-radius:9px; box-shadow:var(--shadow-lg); overflow:hidden;}
  .agent-picker.open .agent-picker-menu{display:block;}
  .agent-picker-search{display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid var(--border-soft);}
  .agent-picker-search .icon{width:14px; height:14px; color:var(--text-tertiary); flex-shrink:0;}
  .agent-picker-search input{width:100%; background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--text-primary); outline:none; padding:7px 8px; font-size:12px;}
  .agent-picker-search input:focus{border-color:var(--accent);}
  .agent-picker-options{max-height:260px; overflow-y:auto; padding:5px; scrollbar-width:thin; scrollbar-color:var(--border) transparent;}
  .agent-picker-options::-webkit-scrollbar{width:6px;}
  .agent-picker-options::-webkit-scrollbar-track{background:transparent;}
  .agent-picker-options::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
  .agent-picker-option{width:100%; border:none; background:transparent; color:var(--text-secondary); padding:8px; border-radius:7px; text-align:left; cursor:pointer;}
  .agent-picker-option:hover,.agent-picker-option.selected{background:var(--surface-hover); color:var(--text-primary);}
  .agent-picker-option .avatar-circle{width:30px; height:30px; font-size:10px;}
  .agent-picker-empty{padding:18px 10px; text-align:center; color:var(--text-tertiary); font-size:12px;}
  .confirm-icon{width:44px; height:44px; border-radius:10px; background:rgba(245,85,108,.12); color:var(--danger); display:flex; align-items:center; justify-content:center; margin-bottom:4px;}
  .confirm-icon .icon{width:22px; height:22px;}
  .confirm-body p{color:var(--text-secondary); font-size:13.5px; line-height:1.6;}
  .confirm-body b{color:var(--text-primary);}

  .cmdk-overlay{position:fixed; inset:0; background:rgba(3,4,8,.55); backdrop-filter:blur(3px); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding-top:14vh;}
  .cmdk{width:100%; max-width:560px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); overflow:hidden; animation:modalIn .15s ease;}
  .cmdk-input-row{display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--border-soft);}
  .cmdk-input-row .icon{color:var(--text-tertiary);}
  .cmdk-input-row input{flex:1; background:transparent; border:none; outline:none; font-size:15px;}
  .cmdk-input-row kbd{font-family:var(--font-mono); font-size:10.5px; background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:2px 6px; color:var(--text-tertiary);}
  .cmdk-list{max-height:340px; overflow-y:auto; padding:8px;}
  .cmdk-section{font-family:var(--font-mono); font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-tertiary); padding:10px 10px 4px;}
  .cmdk-item{display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:8px; font-size:13px; color:var(--text-secondary); cursor:pointer;}
  .cmdk-item:hover, .cmdk-item.sel{background:var(--surface-hover); color:var(--text-primary);}
  .cmdk-item .icon{color:var(--text-tertiary); width:15px; height:15px;}
  .cmdk-item .badge{margin-left:auto;}
  .cmdk-empty{padding:30px; text-align:center; color:var(--text-tertiary); font-size:12.5px;}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px;}
  .panel-title{font-family:var(--font-mono); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--text-secondary); margin-bottom:18px; display:flex; align-items:center; gap:8px;}
  .analytics-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; align-items:start;}
  .month-chart{display:flex; align-items:flex-end; gap:8px; height:140px; padding-top:10px;}
  .month-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end;}
  .month-col__bar{width:100%; max-width:26px; background:linear-gradient(180deg, var(--accent-2), var(--accent)); border-radius:5px 5px 2px 2px; min-height:3px; transition:height .5s cubic-bezier(.2,.9,.3,1);}
  .month-col__label{font-size:10px; font-family:var(--font-mono); color:var(--text-tertiary);}

  .type-bar-row{margin-bottom:20px;}
  .type-bar-row:last-child{margin-bottom:0;}
  .type-bar-row__top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px;}
  .type-bar-row__label{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700;}
  .type-bar-row__label .icon{width:15px; height:15px;}
  .type-bar-row__count{font-family:var(--font-mono); font-size:12px; color:var(--text-tertiary); white-space:nowrap;}
  .type-bar-row__count b{color:var(--text-secondary); font-weight:600;}
  .type-bar-track{height:10px; border-radius:20px; background:var(--surface-2); overflow:hidden;}
  .type-bar-fill{height:100%; border-radius:20px; transition:width .5s cubic-bezier(.2,.9,.3,1); min-width:2px;}
  .panel-title-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .panel-title-row .panel-title{margin-bottom:0;}
  .export-btn-group{display:flex; align-items:center; gap:8px;}

  /* ---- Agents ---- */
  .avatar-circle{
    position:relative; border-radius:50%; overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; color:#fff;
    width:34px; height:34px; font-size:12px;
  }
  .avatar-circle img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .avatar-circle.sm{width:20px; height:20px; font-size:9px;}
  .avatar-circle.lg{width:58px; height:58px; font-size:17px;}
  .assignee-chip{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-secondary);}
  .assignee-chip.unassigned{color:var(--text-tertiary); font-style:italic;}
  .assignee-chip--clickable{
    background:none; border:none; padding:0; cursor:pointer; font-family:inherit;
    border-radius:20px; transition:background var(--transition), color var(--transition);
  }
  .assignee-chip--clickable:hover{ background:rgba(111,107,255,.12); color:var(--accent); }

  /* Clickable avatar wrapper on agent cards */
  .avatar-btn{
    background:none; border:none; padding:0; cursor:pointer; border-radius:50%; flex-shrink:0;
    transition:box-shadow var(--transition);
  }
  .avatar-btn:hover .avatar-circle{box-shadow:0 0 0 3px var(--accent), 0 0 12px rgba(111,107,255,.4);}

  /* Photo lightbox */
  .photo-lightbox{
    background:transparent; border:none;
    animation:modalIn .22s cubic-bezier(.2,.9,.3,1);
    display:flex; flex-direction:column; align-items:center; gap:18px;
    width:fit-content;
  }
  .photo-lightbox__ring{
    width:320px; height:320px; border-radius:50%; flex-shrink:0;
    padding:5px;
    background:transparent;
    border:4px solid var(--accent);
    box-shadow:0 0 0 2px rgba(111,107,255,.25), 0 0 28px 6px rgba(111,107,255,.45), inset 0 0 12px rgba(111,107,255,.15);
    overflow:hidden;
  }
  .photo-lightbox__img{
    display:block; width:100%; height:100%; object-fit:cover;
    border-radius:50%;
  }
  .photo-lightbox__name{
    font-family:var(--font-mono); font-size:15px; font-weight:700;
    color:#fff; text-align:center; letter-spacing:.2px;
    text-shadow:0 2px 12px rgba(0,0,0,.7);
  }
  .photo-lightbox__role{
    font-size:12px; color:rgba(255,255,255,.55); font-family:var(--font-mono);
    text-align:center; margin-top:3px;
  }
  .photo-lightbox__close{
    position:fixed; top:20px; right:20px;
    width:36px; height:36px; border-radius:50%; border:none;
    background:rgba(255,255,255,.12); color:#fff; backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background var(--transition);
  }
  .photo-lightbox__close:hover{background:rgba(255,255,255,.22);}
  .photo-lightbox__close .icon{width:16px; height:16px;}

  /* Chart type tabs */
  .chart-type-tabs{display:flex; align-items:center; gap:3px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:3px;}
  .chart-tab{
    display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border-radius:6px; font-size:11.5px; font-weight:600; background:transparent; border:none;
    color:var(--text-tertiary); transition:all var(--transition); font-family:var(--font-mono); cursor:pointer;
  }
  .chart-tab.active{background:var(--surface); color:var(--text-primary); box-shadow:inset 0 0 0 1px var(--border);}
  .chart-tab:hover:not(.active){color:var(--text-secondary);}
  .chart-tab .icon{width:13px; height:13px;}

  .agent-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:18px;}
  .agent-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:22px; display:flex; flex-direction:column; gap:16px;
    transition:border-color var(--transition), transform var(--transition);
  }
  .agent-card:hover{transform:translateY(-2px); border-color:var(--border);}
  .agent-card__top{display:flex; align-items:center; gap:14px;}
  .agent-card__name{font-size:16px; font-weight:700;}
  .agent-card__role{font-size:13px; color:var(--text-tertiary); margin-top:3px;}
  .agent-card__stat{
    font-family:var(--font-mono); font-size:13px; color:var(--text-secondary);
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:11px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .agent-card__stat--clickable{
    width:100%; cursor:pointer; text-align:left;
    transition:background var(--transition), border-color var(--transition);
  }
  .agent-card__stat--clickable:hover{ background:rgba(111,107,255,.1); border-color:var(--accent); color:var(--text-primary); }
  .agent-card__actions{display:flex; gap:6px; padding-top:10px; border-top:1px solid var(--border-soft); margin-top:auto;}

  .perf-row{display:flex; align-items:flex-start; gap:12px; margin-bottom:18px;}
  .perf-row:last-child{margin-bottom:0;}
  .perf-rank{width:16px; padding-top:8px; font-family:var(--font-mono); color:var(--text-tertiary); font-size:12px; flex-shrink:0;}
  .perf-main{flex:1; min-width:0;}
  .perf-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .perf-name{display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:700;}
  .perf-count{font-family:var(--font-mono); font-size:12px; color:var(--text-tertiary); white-space:nowrap;}
  .perf-track{height:8px; border-radius:20px; background:var(--surface-2); overflow:hidden;}
  .perf-fill{height:100%; border-radius:20px; transition:width .5s cubic-bezier(.2,.9,.3,1); min-width:2px;}
  .perf-list{max-height:340px; overflow-y:auto; padding-right:8px; scrollbar-width:thin; scrollbar-color:var(--border) transparent;}
  .perf-list::-webkit-scrollbar{width:6px;}
  .perf-list::-webkit-scrollbar-track{background:transparent;}
  .perf-list::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}

  .table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-tertiary); padding:13px 16px; border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap;}
  tbody td{padding:13px 16px; border-bottom:1px solid var(--border-soft); color:var(--text-secondary); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-hover);}
  td.name-cell{color:var(--text-primary); font-weight:600;}
  td.desc-cell{max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-tertiary);}

  .settings-grid{display:flex; flex-direction:column; gap:16px; max-width:640px;}
  .setting-row{display:flex; align-items:center; justify-content:space-between; gap:20px; padding:16px 18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
  .setting-row__text b{font-size:13.5px; font-weight:600; display:block; margin-bottom:3px;}
  .setting-row__text span{font-size:12px; color:var(--text-tertiary); line-height:1.5; display:block;}
  .switch{width:42px; height:24px; border-radius:20px; background:var(--surface-2); border:1px solid var(--border); position:relative; flex-shrink:0; transition:background var(--transition);}
  .switch::after{content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:var(--text-tertiary); top:2px; left:2px; transition:all var(--transition);}
  .switch.on{background:var(--accent); border-color:var(--accent);}
  .switch.on::after{transform:translateX(18px); background:#fff;}
  .kv-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row span:first-child{color:var(--text-tertiary); font-family:var(--font-mono);}
  .kv-row span:last-child{font-family:var(--font-mono); color:var(--text-secondary);}
  .danger-zone{border-color:rgba(245,85,108,.3);}

  #toast-root{position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:10px; z-index:300;}
  .toast{
    display:flex; align-items:center; gap:10px; background:var(--bg-elevated); border:1px solid var(--border);
    padding:12px 16px; border-radius:9px; box-shadow:var(--shadow-lg); font-size:13px; min-width:240px;
    animation:toastIn .2s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes toastIn{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:none;}}
  .toast .icon{width:16px; height:16px; flex-shrink:0;}
  .toast.success .icon{color:var(--success);}
  .toast.error .icon{color:var(--danger);}
  .toast.info .icon{color:var(--accent-2);}

  .loader{display:flex; align-items:center; justify-content:center; padding:80px; color:var(--text-tertiary); gap:10px; font-family:var(--font-mono); font-size:12.5px;}
  .spin{width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- Agent photo uploader ---- */
  .photo-uploader{display:flex; align-items:center; gap:16px;}
  .photo-uploader__preview{
    position:relative; width:64px; height:64px; border-radius:50%; overflow:hidden; flex-shrink:0;
    background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-tertiary);
  }
  .photo-uploader__preview img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .photo-uploader__actions{display:flex; flex-direction:column; gap:8px; flex:1;}
  .photo-uploader__row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .file-btn{
    display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:8px;
    font-size:12.5px; font-weight:600; background:var(--surface); border:1px solid var(--border); color:var(--text-secondary);
    transition:all var(--transition); position:relative; overflow:hidden;
  }
  .file-btn:hover{color:var(--text-primary); border-color:var(--text-tertiary);}
  .file-btn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;}

  @media (max-width:900px){
    .app{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    .analytics-grid{grid-template-columns:1fr;}
  }
</style>
</head>

function fmtDate(v){
  if(!v) return '—';
  let d;
  if (v && typeof v.toDate === 'function') d = v.toDate();
  else d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  const mm = String(d.getUTCMonth()+1).padStart(2,'0');
  const dd = String(d.getUTCDate()).padStart(2,'0');
  const yyyy = d.getUTCFullYear();
  return mm + '/' + dd + '/' + yyyy;
}
function analyticsDateDisplay(v){
  return v ? fmtDate(v) : '';
}
function parseAnalyticsDateInput(value){
  const raw = value.trim();
  if(!raw) return '';
  const match = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!match) return null;
  const [, mm, dd, yyyy] = match;
  const date = new Date(Date.UTC(Number(yyyy), Number(mm)-1, Number(dd)));
  if(date.getUTCFullYear() !== Number(yyyy) || date.getUTCMonth() !== Number(mm)-1 || date.getUTCDate() !== Number(dd)) return null;
  return `${yyyy}-${mm}-${dd}`;
}
function formatAnalyticsDateInput(value){
  const digits = value.replace(/\D/g,'').slice(0,8);
  if(digits.length <= 2) return digits;
  if(digits.length <= 4) return `${digits.slice(0,2)}/${digits.slice(2)}`;
  return `${digits.slice(0,2)}/${digits.slice(2,4)}/${digits.slice(4)}`;
}

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);

function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function initials(name){
  const parts = (name||'?').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[1][0]).toUpperCase();
}
function toast(msg, type='info'){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const iconName = type==='success'?'check':type==='error'?'alert':'zap';
  el.innerHTML = `${icon(iconName)}<span>${esc(msg)}</span>`;
  root.appendChild(el);

}

/* ---------------- IMAGE HELPERS ---------------- */
const MAX_PHOTO_DIM = 300;
const JPEG_QUALITY = 0.82;

function fileToResizedDataUrl(file, maxDim = MAX_PHOTO_DIM){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/')){
      reject(new Error('Please choose an image file.'));
      return;
    }
    if(file.size > 8 * 1024 * 1024){
      reject(new Error('Image is too large (max 8MB).'));
      return;
    }
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Could not read the file.'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Could not decode the image.'));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

    options.innerHTML = agentPickerOptionsHtml(hidden.value, query);

        hidden.value = option.dataset.agentPickerOption || '';

const DELETE_CONFIRM_WORD = 'DELETE';

function openConfirm({ title, message, confirmLabel, danger=true, onConfirm, requirePassword=true }){
  openModal(`
    <div class="modal confirm">
      <div class="modal-body" style="padding-top:22px;">
        <div class="confirm-icon">${icon('alert')}</div>
        <div class="confirm-body">
          <h3 style="font-family:var(--font-mono); font-size:15px; margin-bottom:8px;">${esc(title)}</h3>
          <p>${message}</p>
        </div>
        ${requirePassword ? `
        <div class="field" style="margin-top:2px;">
          <label>Type <span style="color:var(--danger)">${DELETE_CONFIRM_WORD}</span> to confirm</label>
          <input type="password" id="confirm-password" placeholder="Enter Password" autocomplete="off" autocapitalize="off" spellcheck="false">
          <div class="field-hint">Masked on purpose — only type this if you know what you're doing.</div>
        </div>` : ''}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close-modal>Cancel</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" id="confirm-go" ${requirePassword?'disabled':''}>${esc(confirmLabel)}</button>
      </div>
    </div>
  `);
  const goBtn = document.getElementById('confirm-go');
  let pwInput = null;
  if(requirePassword){
    pwInput = document.getElementById('confirm-password');
    pwInput.focus();
    pwInput.oninput = ()=>{ goBtn.disabled = pwInput.value !== DELETE_CONFIRM_WORD; };
    pwInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && pwInput.value === DELETE_CONFIRM_WORD) goBtn.click();
    });
  }
  goBtn.onclick = async ()=>{
    if(requirePassword && pwInput.value !== DELETE_CONFIRM_WORD){
      toast(`Type ${DELETE_CONFIRM_WORD} to confirm.`, 'error');
      return;
    }
    const btn = document.getElementById('confirm-go');
    btn.disabled = true; btn.textContent='Working…';
    try{ await onConfirm(); closeModal(); }
    catch(err){ console.error(err); toast('Action failed. '+(err.message||''),'error'); closeModal(); }
  };
}

/* ---------------- ANALYTICS ---------------- */
function isWithinAnalyticsDateRange(it){
  const { analyticsStartDate:start, analyticsEndDate:end } = state;
  if(!start && !end) return true;
  const d = it.date || '';
  if(!d) return false;
  if(start && d < start) return false;
  if(end && d > end) return false;
  return true;
}
function analyticsTicketMatchesFilter(it){
  if(state.analyticsFilter==='all') return true;
  const typeLabel = (it.type && it.type.trim()) ? it.type.trim() : 'Uncategorized';
  return typeLabel === state.analyticsFilter;
}
function collectEntriesForAnalytics(){
  return state.tickets.filter(it=> analyticsTicketMatchesFilter(it) && isWithinAnalyticsDateRange(it));
}

function computeTypeBreakdown(entries){
  const counts = new Map();
  entries.forEach(it=>{
    const key = (it.type && it.type.trim()) ? it.type.trim() : 'Uncategorized';
    counts.set(key, (counts.get(key)||0) + 1);
  });
  const rows = [];
  TICKET_TYPES.forEach(t=>{
    rows.push({ label:t, count: counts.get(t)||0, meta: TYPE_META[t] });
    counts.delete(t);
  });
  const uncategorizedCount = counts.get('Uncategorized') || 0;
  counts.delete('Uncategorized');
  const customRows = [...counts.entries()].sort((a,b)=> b[1]-a[1])
    .map(([name,count])=> ({ label:name, count, meta: metaForCustomName(name) }));
  const allRows = [...rows, ...customRows];
  if(uncategorizedCount > 0){
    allRows.push({ label:'Uncategorized', count:uncategorizedCount, meta:{ icon:'file', color:'var(--text-tertiary)', bg:'var(--surface-2)' } });
  }
  return { rows: allRows, total: entries.length };
}

function computeAgentPerformance(entries){
  const counts = new Map();
  let unassigned = 0;
  entries.forEach(it=>{
    if(it.assignedAgentId){ counts.set(it.assignedAgentId, (counts.get(it.assignedAgentId)||0)+1); }
    else unassigned++;
  });
  const rows = [...counts.entries()]
    .map(([id,count])=> ({ id, agent: agentById(id), count }))
    .filter(r=> r.agent)
    .sort((a,b)=> b.count-a.count);
  if(unassigned>0) rows.push({ id:null, agent:null, count: unassigned });
  return rows;
}

function dateRangeLabel(){
  const { analyticsStartDate:start, analyticsEndDate:end } = state;
  if(!start && !end) return 'all-dates';
  if(start && end) return `${start}_to_${end}`;
  if(start) return `from-${start}`;
  return `through-${end}`;
}

function exportTypeCSV(rows, total, filterLabel){
  const headers = ['Type','Tickets','Percentage'];
  const data = rows.map(r=> [r.label, r.count, total ? ((r.count/total*100).toFixed(1)+'%') : '0%']);
  const csv = [headers, ...data].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ticket-type-breakdown-${filterLabel}-${dateRangeLabel()}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast('Type breakdown exported (CSV).', 'success');
}

function exportTypeBreakdownPDF(rows, total, filterLabel){
  if(!window.jspdf){ toast('PDF library failed to load. Check your connection.', 'error'); return; }
  const { jsPDF } = window.jspdf;

function getLast6MonthsData(){
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ key:`${d.getFullYear()}-${d.getMonth()}`, label:d.toLocaleDateString('en-US',{month:'short'}), count:0 });
  }
  state.tickets.forEach(it=>{
    if(!it.date) return;
    const d = new Date(it.date+'T00:00:00');
    if(isNaN(d.getTime())) return;
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    const m = months.find(m=>m.key===key);
    if(m) m.count++;
  });
  return months;
}
function getRangeMonthsData(){
  const { analyticsStartDate:start, analyticsEndDate:end } = state;
  const startD = start ? new Date(start+'T00:00:00') : (end ? new Date(end+'T00:00:00') : new Date());
  const endD = end ? new Date(end+'T00:00:00') : (start ? new Date(start+'T00:00:00') : new Date());
  const months = [];
  let cursor = new Date(startD.getFullYear(), startD.getMonth(), 1);
  const last = new Date(endD.getFullYear(), endD.getMonth(), 1);
  let guard = 0;
  while(cursor <= last && guard < 60){
    months.push({ key:`${cursor.getFullYear()}-${cursor.getMonth()}`, label:cursor.toLocaleDateString('en-US',{month:'short', year:'2-digit'}), count:0 });
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    guard++;
  }
  if(!months.length){
    months.push({ key:`${startD.getFullYear()}-${startD.getMonth()}`, label:startD.toLocaleDateString('en-US',{month:'short', year:'2-digit'}), count:0 });
  }
  collectEntriesForAnalytics().forEach(it=>{
    if(!it.date) return;
    const d = new Date(it.date+'T00:00:00');
    if(isNaN(d.getTime())) return;
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    const m = months.find(mo=>mo.key===key);
    if(m) m.count++;
  });
  return months;
}
function isDateRangeActive(){ return !!(state.analyticsStartDate || state.analyticsEndDate); }
function getMonthsChartData(){ return isDateRangeActive() ? getRangeMonthsData() : getLast6MonthsData(); }

/* ---------------- SVG CHART RENDERERS ---------------- */
function renderChartSVG(months, chartType){
  if(chartType === 'pie') return renderPieSVG(months);

  const W = 800, H = 260;
  const padL = 42, padR = 18, padT = 36, padB = 46;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const n = months.length;
  const maxCount = Math.max(1, ...months.map(m => m.count));

  const xFor = i => padL + (i + 0.5) * (chartW / n);
  const yFor = v => padT + chartH - (v / maxCount) * chartH;

  const gridSteps = [0, 0.25, 0.5, 0.75, 1];
  const gridLines = gridSteps.map(pct => {
    const y = padT + chartH * (1 - pct);
    const val = Math.round(maxCount * pct);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="4,4" opacity="0.7"/>
    <text x="${padL - 7}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-tertiary)" font-family="'JetBrains Mono',monospace">${val}</text>`;
  }).join('');

  const baseline = `<line x1="${padL}" y1="${padT + chartH}" x2="${W - padR}" y2="${padT + chartH}" stroke="var(--border)" stroke-width="1.5"/>`;

  let defs = `<defs>
    <linearGradient id="cg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#6f6bff"/></linearGradient>
    <linearGradient id="cg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#6f6bff"/></linearGradient>
    <linearGradient id="cg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6f6bff" stop-opacity="0.45"/><stop offset="100%" stop-color="#6f6bff" stop-opacity="0.03"/></linearGradient>
  </defs>`;

  let dataEl = '';

  if(chartType === 'bar'){
    const barW = Math.min(56, (chartW / n) * 0.52);
    dataEl = months.map((m, i) => {
      const x = xFor(i), y = yFor(m.count);
      const h = Math.max(padT + chartH - y, 2);
      return `<rect x="${(x - barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="url(#cg1)"/>
        ${m.count > 0 ? `<text x="${x.toFixed(1)}" y="${(y - 8).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace">${m.count}</text>` : ''}
        <text x="${x.toFixed(1)}" y="${(padT + chartH + 20).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--text-tertiary)" font-family="'JetBrains Mono',monospace">${m.label}</text>`;
    }).join('');

  } else if(chartType === 'line'){
    const pts = months.map((m, i) => `${xFor(i).toFixed(1)},${yFor(m.count).toFixed(1)}`).join(' ');
    dataEl = `<polyline points="${pts}" fill="none" stroke="url(#cg2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    dataEl += months.map((m, i) => {
      const x = xFor(i), y = yFor(m.count);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="#6f6bff" stroke="var(--bg-elevated)" stroke-width="2.5"/>
        ${m.count > 0 ? `<text x="${x.toFixed(1)}" y="${(y - 13).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace">${m.count}</text>` : ''}
        <text x="${x.toFixed(1)}" y="${(padT + chartH + 20).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--text-tertiary)" font-family="'JetBrains Mono',monospace">${m.label}</text>`;
    }).join('');

  } else if(chartType === 'area'){
    const pts = months.map((m, i) => `${xFor(i).toFixed(1)},${yFor(m.count).toFixed(1)}`);
    const areaPath = `M${xFor(0).toFixed(1)},${(padT + chartH).toFixed(1)} L${pts.join(' L')} L${xFor(n - 1).toFixed(1)},${(padT + chartH).toFixed(1)} Z`;
    const linePath = `M${pts.join(' L')}`;
    dataEl = `<path d="${areaPath}" fill="url(#cg3)"/>
      <path d="${linePath}" fill="none" stroke="url(#cg2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    dataEl += months.map((m, i) => {
      const x = xFor(i), y = yFor(m.count);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#6f6bff" stroke="var(--bg-elevated)" stroke-width="2.5"/>
        ${m.count > 0 ? `<text x="${x.toFixed(1)}" y="${(y - 11).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace">${m.count}</text>` : ''}
        <text x="${x.toFixed(1)}" y="${(padT + chartH + 20).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--text-tertiary)" font-family="'JetBrains Mono',monospace">${m.label}</text>`;
    }).join('');

  } else if(chartType === 'scatter'){
    dataEl = months.map((m, i) => {
      const x = xFor(i), y = yFor(m.count);
      const r = m.count === 0 ? 4 : Math.max(7, Math.min(22, 7 + (m.count / maxCount) * 15));
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#6f6bff" fill-opacity="0.72" stroke="#6f6bff" stroke-width="1.5"/>
        ${m.count > 0 ? `<text x="${x.toFixed(1)}" y="${(y - r - 6).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace">${m.count}</text>` : ''}
        <text x="${x.toFixed(1)}" y="${(padT + chartH + 20).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--text-tertiary)" font-family="'JetBrains Mono',monospace">${m.label}</text>`;
    }).join('');
  }

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible;" xmlns="http://www.w3.org/2000/svg">
    ${defs}${gridLines}${baseline}${dataEl}
  </svg>`;
}

function renderPieSVG(months){
  const total = months.reduce((s, m) => s + m.count, 0);
  if(!total) return `<div style="text-align:center;padding:50px;color:var(--text-tertiary);font-family:var(--font-mono);font-size:13px;">No ticket data to display as pie chart.</div>`;

  const CX = 130, CY = 130, R = 110, IR = 50; // donut
  const COLORS = ['#6f6bff','#22d3ee','#22c55e','#f5a623','#f5556c','#a78bfa','#60a5fa','#f472b6','#34d399','#fbbf24','#fb7185','#38bdf8'];

  let slices = '', angle = -Math.PI / 2;
  const legendItems = [];

  months.forEach((m, i) => {
    if(m.count === 0) return;
    const pct = m.count / total;
    const color = COLORS[i % COLORS.length];

    // Special case: full circle (single slice = 100%) — SVG arcs cannot draw 360°
    if(pct >= 0.9999){
      slices += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="${color}" stroke="var(--bg-elevated)" stroke-width="2.5"/>`;
      slices += `<circle cx="${CX}" cy="${CY}" r="${IR}" fill="var(--bg-elevated)" stroke="none"/>`;
      slices += `<text x="${CX}" y="${(CY + 5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="'JetBrains Mono',monospace">${m.count}</text>`;
      legendItems.push({ label: m.label, count: m.count, color, pct });
      return;
    }

    const startAngle = angle;
    angle += pct * 2 * Math.PI;
    const endAngle = angle;
    const x1 = CX + R * Math.cos(startAngle), y1 = CY + R * Math.sin(startAngle);
    const x2 = CX + R * Math.cos(endAngle),   y2 = CY + R * Math.sin(endAngle);
    const ix1 = CX + IR * Math.cos(startAngle), iy1 = CY + IR * Math.sin(startAngle);
    const ix2 = CX + IR * Math.cos(endAngle),   iy2 = CY + IR * Math.sin(endAngle);
    const large = pct > 0.5 ? 1 : 0;
    slices += `<path d="M${ix1.toFixed(1)},${iy1.toFixed(1)} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${large},1 ${x2.toFixed(1)},${y2.toFixed(1)} L${ix2.toFixed(1)},${iy2.toFixed(1)} A${IR},${IR} 0 ${large},0 ${ix1.toFixed(1)},${iy1.toFixed(1)} Z" fill="${color}" stroke="var(--bg-elevated)" stroke-width="2.5"/>`;
    // label inside slice if it's big enough
    if(pct > 0.08){
      const midA = (startAngle + endAngle) / 2;
      const lx = CX + (IR + (R - IR) * 0.5) * Math.cos(midA);
      const ly = CY + (IR + (R - IR) * 0.5) * Math.sin(midA);
      slices += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="'JetBrains Mono',monospace">${m.count}</text>`;
    }
    legendItems.push({ label: m.label, count: m.count, color, pct });
  });

  // center total
  slices += `<text x="${CX}" y="${CY - 6}" text-anchor="middle" font-size="13" fill="var(--text-tertiary)" font-family="'JetBrains Mono',monospace">Total</text>
    <text x="${CX}" y="${CY + 14}" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace">${total}</text>`;

  const legendHtml = legendItems.map(l =>
    `<div style="display:flex;align-items:center;gap:8px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text-secondary);margin-bottom:7px;">
      <span style="width:11px;height:11px;border-radius:3px;background:${l.color};flex-shrink:0;display:inline-block;"></span>
      <span style="flex:1;">${esc(l.label)}</span>
      <span style="font-weight:700;color:var(--text-primary);">${l.count}</span>
      <span style="color:var(--text-tertiary);font-size:10px;">${(l.pct*100).toFixed(0)}%</span>
    </div>`
  ).join('');

  return `<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:8px 0;">
    <svg viewBox="0 0 ${CX*2} ${CY*2}" width="260" height="260" style="flex-shrink:0;" xmlns="http://www.w3.org/2000/svg">${slices}</svg>
    <div style="flex:1;min-width:140px;">${legendHtml}</div>
  </div>`;
}

        <div class="panel-title">${icon('clock')} ${rangeActive ? 'Tickets — Selected Date Range' : 'Tickets — Last 6 Months'}</div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <div class="chart-type-tabs" id="chart-type-tabs">
            <button class="chart-tab ${state.chartType==='bar'?'active':''}" data-chart-type="bar">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Bar
            </button>
            <button class="chart-tab ${state.chartType==='line'?'active':''}" data-chart-type="line">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Line
            </button>
            <button class="chart-tab ${state.chartType==='area'?'active':''}" data-chart-type="area">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20 L7 12 L12 16 L17 6 L21 10 L21 20 Z"/></svg> Area
            </button>
            <button class="chart-tab ${state.chartType==='pie'?'active':''}" data-chart-type="pie">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg> Pie
            </button>
            <button class="chart-tab ${state.chartType==='scatter'?'active':''}" data-chart-type="scatter">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="1.5"/><circle cx="17" cy="7" r="1.5"/><circle cx="11" cy="18" r="1.5"/><circle cx="14" cy="11" r="1.5"/><circle cx="5" cy="8" r="1.5"/></svg> Scatter
            </button>
          </div>
          <button class="btn btn-ghost btn-sm" id="export-months-pdf">${icon('file')} Export PDF</button>
        </div>
      </div>
      <div id="month-chart-container" style="width:100%; padding-top:8px;"></div>
    </div>
  `;
}

/* ---------------- REPORTS ---------------- */
function filterReportsTickets(list){
  const q = state.reportsSearch.trim().toLowerCase();
  if(!q) return list;
  return list.filter(it=>{
    const agent = agentById(it.assignedAgentId);
    const typeLabel = (it.type && it.type.trim()) ? it.type.trim() : 'uncategorized';
    return (it.title||'').toLowerCase().includes(q)
      || typeLabel.toLowerCase().includes(q)
      || (it.notes||'').toLowerCase().includes(q)
      || (agent ? agent.name.toLowerCase().includes(q) : 'unassigned'.includes(q));
  });
}
function renderReports(){
  const allTickets = [...state.tickets].sort((a,b)=> (a.date||'') < (b.date||'') ? 1 : -1);
  const list = filterReportsTickets(allTickets);
  const q = state.reportsSearch;
  return `
    <div class="view-header">
      <div>
        <div class="view-title">Reports</div>
        <div class="view-sub">Full ledger of every ticket in the workspace, ready to export.</div>
      </div>
      <button class="btn btn-ghost" id="export-csv">${icon('download')} Export CSV</button>
    </div>

    <div class="toolbar">
      <div class="field-search">
        ${icon('search')}
        <input type="text" id="reports-search" placeholder="Search by title, type, agent or notes…" value="${esc(q)}">
      </div>
    </div>

    ${list.length ? ticketsTable(list, {withActions:false}) : emptyState(
        q ? 'No matches found' : 'No tickets to report',
        q ? `No tickets match "${esc(q)}".` : 'Once you add tickets, they will show up here.',
        null, null)}
  `;
}

/* ---------------- SETTINGS ---------------- */
function renderSettings(){
  return `
    <div class="view-header">
      <div>
        <div class="view-title">Settings</div>
        <div class="view-sub">Workspace preferences and connection info.</div>
      </div>
    </div>

    <div class="settings-grid">
      <div class="setting-row">
        <div class="setting-row__text">
          <b>Dark interface</b>
          <span>Switch the entire workspace to God Mode dark theme.</span>
        </div>
        <div class="switch ${state.theme==='dark'?'on':''}" id="set-theme-switch"></div>
      </div>

      <div class="panel">
        <div class="panel-title">${icon('zap')} Connection</div>
        <div class="kv-row"><span>project_id</span><span>${firebaseConfig.projectId}</span></div>
        <div class="kv-row"><span>auth_mode</span><span>none (open workspace)</span></div>
        <div class="kv-row"><span>sync_status</span><span>live</span></div>
        <div class="kv-row"><span>total_tickets</span><span>${state.tickets.length}</span></div>
        <div class="kv-row"><span>total_agents</span><span>${state.agents.length}</span></div>
        <div class="kv-row"><span>agent_photos_store</span><span>Realtime Database</span></div>
      </div>

      <div class="panel danger-zone">
        <div class="panel-title" style="color:var(--danger)">${icon('alert')} Danger Zone</div>
        <div class="setting-row" style="border:none; padding:0 0 14px;">
          <div class="setting-row__text">
            <b>Delete all tickets</b>
            <span>Permanently remove every ticket in this workspace. Cannot be undone.</span>
          </div>
          <button class="btn btn-danger btn-sm" id="delete-all-tickets">${icon('trash')} Delete Tickets</button>
        </div>
        <div class="setting-row" style="border:none; padding:0;">
          <div class="setting-row__text">
            <b>Delete all agents</b>
            <span>Permanently remove every agent. Assigned tickets become unassigned.</span>
          </div>
          <button class="btn btn-danger btn-sm" id="delete-all-agents">${icon('trash')} Delete Agents</button>
        </div>
      </div>
    </div>
  `;
}

/* ---------------- RENDER / BIND ---------------- */
function render(){
  renderNav();
  document.getElementById('crumb-current').textContent = state.route;
  const root = document.getElementById('view-root');

  if(!state.ticketsLoaded || !state.agentsLoaded){
    root.innerHTML = `<div class="loader"><div class="spin"></div> Connecting to workspace…</div>`;
    return;
  }

  let html = '';
  if(state.route==='dashboard') html = renderDashboard();
  else if(state.route==='tickets') html = renderTickets();
  else if(state.route==='agents') html = renderAgents();
  else if(state.route==='analytics') html = renderAnalytics();
  else if(state.route==='reports') html = renderReports();
  else if(state.route==='settings') html = renderSettings();
  root.innerHTML = html;

  bindTicketActions(root);
  bindAgentActions(root);
  bindViewActions(root);
  bindNoteButtons(root);
}

function bindViewActions(root){
  root.querySelectorAll('#tickets-new, #empty-new-ticket').forEach(btn=>{ btn.onclick = ()=> openTicketForm(); });
  root.querySelectorAll('#agents-new, #empty-new-agent').forEach(btn=>{ btn.onclick = ()=> openAgentForm(); });

  const searchInput = root.querySelector('#tickets-search') || root.querySelector('#agents-search');
  if(searchInput){
    searchInput.oninput = ()=>{
      state.search = searchInput.value; render();
      setTimeout(()=>{ const el=document.getElementById(searchInput.id); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} }, 0);
    };
  }
  root.querySelectorAll('[data-filter]').forEach(t=>{ t.onclick = ()=>{ state.filter = t.dataset.filter; render(); }; });

  const exportBtn = root.querySelector('#export-csv');
  if(exportBtn) exportBtn.onclick = exportCSV;

  const reportsSearchInput = root.querySelector('#reports-search');
  if(reportsSearchInput){
    reportsSearchInput.oninput = ()=>{
      state.reportsSearch = reportsSearchInput.value; render();
      setTimeout(()=>{ const el=document.getElementById('reports-search'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} }, 0);
    };
  }

  root.querySelectorAll('[data-analytics-filter]').forEach(t=>{
    t.onclick = ()=>{ state.analyticsFilter = t.dataset.analyticsFilter; render(); };
  });
  const dateStartInput = root.querySelector('#analytics-date-start');
  if(dateStartInput) dateStartInput.onchange = ()=>{ state.analyticsStartDate = dateStartInput.value; render(); };
  const dateEndInput = root.querySelector('#analytics-date-end');
  if(dateEndInput) dateEndInput.onchange = ()=>{ state.analyticsEndDate = dateEndInput.value; render(); };
  const dateClearBtn = root.querySelector('#analytics-date-clear');
  if(dateClearBtn) dateClearBtn.onclick = ()=>{ state.analyticsStartDate=''; state.analyticsEndDate=''; render(); };

  const exportTypeCsvBtn = root.querySelector('#export-type-csv');
  if(exportTypeCsvBtn) exportTypeCsvBtn.onclick = ()=>{
    const entries = collectEntriesForAnalytics();
    const { rows, total } = computeTypeBreakdown(entries);
    exportTypeCSV(rows, total, state.analyticsFilter);
  };
  const exportTypePdfBtn = root.querySelector('#export-type-pdf');
  if(exportTypePdfBtn) exportTypePdfBtn.onclick = ()=>{
    const entries = collectEntriesForAnalytics();
    const { rows, total } = computeTypeBreakdown(entries);
    exportTypeBreakdownPDF(rows, total, state.analyticsFilter);
  };
  const exportPerfCsvBtn = root.querySelector('#export-perf-csv');
  if(exportPerfCsvBtn) exportPerfCsvBtn.onclick = ()=> exportAgentPerformanceCSV(computeAgentPerformance(collectEntriesForAnalytics()));
  const exportMonthsPdfBtn = root.querySelector('#export-months-pdf');
  if(exportMonthsPdfBtn) exportMonthsPdfBtn.onclick = ()=> exportMonthsChartPDF(getMonthsChartData());

  // Chart type switcher — no full re-render, just redraw the SVG
  root.querySelectorAll('[data-chart-type]').forEach(btn=>{
    btn.onclick = ()=>{
      state.chartType = btn.dataset.chartType;
      root.querySelectorAll('[data-chart-type]').forEach(b=> b.classList.toggle('active', b===btn));
      drawMonthChart();
    };
  });
  // Draw the chart once after bind
  drawMonthChart();

  const themeSwitch = root.querySelector('#set-theme-switch');
  if(themeSwitch) themeSwitch.onclick = ()=>{ state.theme = state.theme==='dark' ? 'light':'dark'; applyTheme(); render(); };

  const deleteAllTicketsBtn = root.querySelector('#delete-all-tickets');
  if(deleteAllTicketsBtn) deleteAllTicketsBtn.onclick = ()=> openConfirm({
    title:'Delete every ticket?',
    message:`This will permanently delete all <b>${state.tickets.length}</b> ticket(s). This cannot be undone.`,
    confirmLabel:'Delete All Tickets', danger:true,
    onConfirm: async()=>{ await Promise.all(state.tickets.map(it=> deleteTicketDoc(it.id))); toast('All tickets deleted.', 'info'); }
  });
  const deleteAllAgentsBtn = root.querySelector('#delete-all-agents');
  if(deleteAllAgentsBtn) deleteAllAgentsBtn.onclick = ()=> openConfirm({
    title:'Delete every agent?',
    message:`This will permanently delete all <b>${state.agents.length}</b> agent(s). Their tickets will become unassigned. This cannot be undone.`,
    confirmLabel:'Delete All Agents', danger:true,
    onConfirm: async()=>{
      await Promise.all(state.tickets.filter(it=>it.assignedAgentId).map(it=> updateTicket(it.id,{assignedAgentId:''})));
      await Promise.all(state.agents.map(a=> deleteAgentDoc(a.id)));
      await Promise.all(state.agents.map(a=> deleteAgentPhoto(a.id)));
      toast('All agents deleted.', 'info');
    }
  });
}

function exportCSV(){
  const list = filterReportsTickets([...state.tickets]);
  const headers = ['Title','Type','Priority','Assigned To','Date','Notes'];
  const rows = list.map(it=>{
    const agent = agentById(it.assignedAgentId);
    return [
      it.title,
      (it.type && it.type.trim()) ? it.type.trim() : 'Uncategorized',
      (PRIORITY_META[it.priority]||{}).label || it.priority,
      agent ? agent.name : 'Unassigned',
      it.date || '',
      it.notes || ''
    ];
  });
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tickets-report.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('Report exported.', 'success');
}

/* ---------------- COMMAND PALETTE ---------------- */
let cmdkOpen = false;
function openCmdk(){
  cmdkOpen = true;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="cmdk-overlay" id="cmdk-overlay">
      <div class="cmdk">
        <div class="cmdk-input-row">
          ${icon('search')}
          <input type="text" id="cmdk-input" placeholder="Search tickets, agents, or type a command…" autocomplete="off">
          <kbd>ESC</kbd>
        </div>
        <div class="cmdk-list" id="cmdk-list"></div>
      </div>
    </div>`;
  const overlay = document.getElementById('cmdk-overlay');
  overlay.addEventListener('mousedown', e=>{ if(e.target.id==='cmdk-overlay') closeCmdk(); });
  const input = document.getElementById('cmdk-input');
  input.focus();
  input.oninput = ()=> renderCmdkList(input.value);
  renderCmdkList('');
}
function closeCmdk(){ cmdkOpen = false; document.getElementById('modal-root').innerHTML=''; }
function renderCmdkList(q){
  const list = document.getElementById('cmdk-list');
  const query = q.trim().toLowerCase();
  const navMatches = NAV.filter(n=> n.label.toLowerCase().includes(query));
  const ticketMatches = state.tickets.filter(it=> !query || it.title.toLowerCase().includes(query) || (it.type||'').toLowerCase().includes(query)).slice(0,6);
  const agentMatches = state.agents.filter(a=> !query || a.name.toLowerCase().includes(query)).slice(0,5);

  let html = '';
  html += `<div class="cmdk-item" data-cmd="new-ticket">${icon('plus')} Create new ticket<span class="badge" style="background:var(--surface-2); color:var(--text-tertiary)">action</span></div>`;
  html += `<div class="cmdk-item" data-cmd="new-agent">${icon('plus')} Create new agent<span class="badge" style="background:var(--surface-2); color:var(--text-tertiary)">action</span></div>`;
  if(navMatches.length){
    html += `<div class="cmdk-section">Navigate</div>`;
    html += navMatches.map(n=>`<div class="cmdk-item" data-nav="${n.id}">${icon(n.icon)} ${n.label}</div>`).join('');
  }
  if(ticketMatches.length){
    html += `<div class="cmdk-section">Tickets</div>`;
    html += ticketMatches.map(it=>{
      const pMeta = PRIORITY_META[it.priority]||PRIORITY_META.medium;
      return `<div class="cmdk-item" data-ticket="${it.id}">${icon('tag')} ${esc(it.title)}<span class="badge" style="background:${pMeta.bg}; color:${pMeta.color}">${pMeta.label}</span></div>`;
    }).join('');
  }
  if(agentMatches.length){
    html += `<div class="cmdk-section">Agents</div>`;
    html += agentMatches.map(a=>`<div class="cmdk-item" data-agent="${a.id}">${icon('user')} ${esc(a.name)}<span class="badge" style="background:var(--surface-2); color:var(--text-tertiary)">${ticketCountForAgent(a.id)} tickets</span></div>`).join('');
  }
  if(!navMatches.length && !ticketMatches.length && !agentMatches.length && query){
    html += `<div class="cmdk-empty">No results for "${esc(q)}"</div>`;
  }
  list.innerHTML = html;
  list.querySelectorAll('[data-nav]').forEach(el=> el.onclick = ()=>{ state.route = el.dataset.nav; closeCmdk(); render(); });
  list.querySelectorAll('[data-ticket]').forEach(el=> el.onclick = ()=>{
    const it = state.tickets.find(x=>x.id===el.dataset.ticket);
    closeCmdk();
    if(it) openTicketForm(it);
  });
  list.querySelectorAll('[data-agent]').forEach(el=> el.onclick = ()=>{
    const a = agentById(el.dataset.agent);
    closeCmdk();
    if(a) openAgentForm(a);
  });
  const newTicketCmd = list.querySelector('[data-cmd="new-ticket"]');
  if(newTicketCmd) newTicketCmd.onclick = ()=>{ closeCmdk(); openTicketForm(); };
  const newAgentCmd = list.querySelector('[data-cmd="new-agent"]');
  if(newAgentCmd) newAgentCmd.onclick = ()=>{ closeCmdk(); openAgentForm(); };
}

document.getElementById('open-cmdk').onclick = openCmdk;
document.addEventListener('keydown', (e)=>{
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    cmdkOpen ? closeCmdk() : openCmdk();
  } else if(e.key === 'Escape'){
    if(cmdkOpen) closeCmdk(); else if(document.getElementById('modal-root').innerHTML) closeModal();
  }
});
document.getElementById('btn-new-ticket').onclick = ()=> openTicketForm();
document.getElementById('btn-new-agent-top').onclick = ()=> openAgentForm();

/* ---------------- LIVE SYNC ---------------- */
function updateConnLabel(){
  const el = document.getElementById('conn-label');
  el.textContent = (state.ticketsLoaded && state.agentsLoaded) ? 'live' : 'syncing';
}

onSnapshot(query(collection(db,'tickets'), orderBy('date','desc')), (snap)=>{
  state.tickets = snap.docs.map(d=> ({ id:d.id, ...d.data() }));
  state.ticketsLoaded = true;
  updateConnLabel();
  render();
}, (err)=>{
  console.error(err);
  state.ticketsLoaded = true;
  document.getElementById('conn-label').textContent = 'offline';
  document.getElementById('view-root').innerHTML = `
    <div class="empty-state">
      ${icon('alert')}
      <h3>Couldn't reach Firestore (tickets)</h3>
      <p>${esc(err.message || 'Check your Firestore security rules allow public reads/writes on the "tickets" collection.')}</p>
    </div>`;
});

onSnapshot(collection(db,'agents'), (snap)=>{
  state.agents = snap.docs.map(d=> ({ id:d.id, ...d.data() }));
  state.agentsLoaded = true;
  updateConnLabel();
  render();
}, (err)=>{
  console.error(err);
  state.agentsLoaded = true;
  document.getElementById('conn-label').textContent = 'offline';
});

// Firestore: agent profile photos, keyed by agent id.
onSnapshot(collection(db, 'agentPhotos'), (snap)=>{
  const photos = {};
  snap.forEach(d=>{ const data = d.data(); if(data.dataUrl) photos[d.id] = data.dataUrl; });
  state.agentPhotos = photos;
  state.agentPhotosLoaded = true;
  render();
}, (err)=>{
  console.error(err);
  state.agentPhotosLoaded = true;
  toast('Could not load agent photos.', 'error');
});

render();
</script>
</body>
</html>
